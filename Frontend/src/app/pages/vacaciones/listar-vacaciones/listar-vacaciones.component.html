<div class="bg-white shadow p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
  <h1 class="text-2xl font-semibold text-gray-800">Listado de Vacaciones</h1>

  <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
    <!-- Filtro por nombre -->
    <div class="relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
        <i class="fas fa-search"></i>
      </span>
      <input
        type="text"
        placeholder="Buscar por nombre..."
        [(ngModel)]="filtroNombre"
        class="border border-gray-300 rounded-md pl-10 pr-4 py-2 text-sm w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Filtro por año -->
    <div class="relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
        <i class="fas fa-calendar-alt"></i>
      </span>
      <input
        type="number"
        placeholder="Año..."
        [(ngModel)]="filtroAnio"
        class="border border-gray-300 rounded-md pl-10 pr-4 py-2 text-sm w-full sm:w-32 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
  </div>
  <!-- Botones -->
  <div class="flex space-x-2">
    <button
      type="button"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md flex items-center text-sm font-medium"
      (click)="irACrearVacacion()"
    >
      <i class="fas fa-plus mr-2"></i> Registrar Vacaciones
    </button>
    <button
      type="button"
      class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-md flex items-center text-sm font-medium"
      (click)="irAMenu()"
    >
      <i class="fas fa-arrow-left mr-2"></i> Regresar al menú
    </button>
  </div>
</div>
<main class="flex-grow p-4 overflow-x-auto">
  <table class="min-w-full bg-white rounded-md shadow overflow-hidden">
    <thead class="bg-gray-100 border-b border-gray-300">
      <tr>
        <th class="text-left text-gray-700 px-4 py-3 text-sm font-semibold">Trabajador</th>
        <th class="text-left text-gray-700 px-4 py-3 text-sm font-semibold">Fecha Inicio</th>
        <th class="text-left text-gray-700 px-4 py-3 text-sm font-semibold">Fecha Fin</th>
        <th class="text-left text-gray-700 px-4 py-3 text-sm font-semibold">Días</th>
        <th class="text-center text-gray-700 px-4 py-3 text-sm font-semibold">Acciones</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-200">
      <tr *ngFor="let v of vacacionesFiltradas" class="hover:bg-gray-50">
        <td class="px-4 py-3 text-sm text-gray-900">{{ v.NombreTrabajador }}</td>
        <td class="px-4 py-3 text-sm text-gray-900">{{ v.FechaInicio | date:'dd/MM/yyyy' }}</td>
        <td class="px-4 py-3 text-sm text-gray-900">{{ v.FechaFin | date:'dd/MM/yyyy' }}</td>
        <td class="px-4 py-3 text-sm text-gray-900">{{ v.DiasTomados }}</td>
        <td class="px-4 py-3 text-center space-x-2">
          <button
            type="button"
            class="text-blue-600 hover:text-blue-800"
            (click)="editarVacacion(v.ID_Movimiento)"
          >
            <i class="fas fa-edit"></i>
          </button>
          <button
            type="button"
            class="text-red-600 hover:text-red-800"
            (click)="eliminarVacacion(v.ID_Movimiento)"
          >
            <i class="fas fa-trash-alt"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</main>
